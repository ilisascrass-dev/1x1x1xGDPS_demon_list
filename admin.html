<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>
    1x1x1xGDPS — Admin Panel
</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:#050806;

    overflow-x:hidden;
}


/* =========================================
   BACKGROUND
========================================= */

.bg{

    position:fixed;

    inset:0;

    z-index:-1;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 15% 10%,
            rgba(40,255,140,.18),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(0,180,255,.12),
            transparent 35%
        ),

        #050806;
}


.orb{

    position:absolute;

    width:380px;
    height:380px;

    border-radius:50%;

    filter:blur(90px);

    opacity:.25;
}


.o1{

    background:#20ff88;

    left:-120px;
    top:-100px;

    animation:
        f1 12s ease-in-out infinite alternate;
}


.o2{

    background:#00b7ff;

    right:-150px;
    bottom:-100px;

    animation:
        f2 15s ease-in-out infinite alternate;
}


@keyframes f1{

    to{
        transform:
            translate(160px,150px)
            scale(1.2);
    }

}


@keyframes f2{

    to{
        transform:
            translate(-140px,-120px)
            scale(1.25);
    }

}


/* =========================================
   HEADER
========================================= */

header{

    padding:
        20px 6%;

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(5,10,8,.60);

    backdrop-filter:
        blur(20px);
}


.logo{

    font-size:23px;

    font-weight:900;
}


.logo span{

    color:#45ff9a;

    text-shadow:
        0 0 18px
        rgba(69,255,154,.35);
}


.status{

    color:#45ff9a;

    font-size:13px;
}


/* =========================================
   MAIN
========================================= */

.wrap{

    width:
        min(1100px,92%);

    margin:
        45px auto 80px;
}


h1{

    font-size:
        clamp(
            35px,
            7vw,
            60px
        );

    margin-bottom:10px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #45ff9a
        );

    -webkit-background-clip:
        text;

    color:transparent;
}


.sub{

    color:#8e9993;

    margin-bottom:30px;
}


/* =========================================
   PANELS
========================================= */

.panel{

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:24px;

    padding:25px;

    backdrop-filter:
        blur(20px);

    margin-bottom:25px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.18);
}


.login{

    max-width:520px;

    margin:
        70px auto;
}


/* =========================================
   FORM
========================================= */

.grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;
}


label{

    display:grid;

    gap:8px;

    color:#9da8a2;

    font-size:13px;
}


input{

    width:100%;

    padding:15px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.10);

    outline:none;

    background:
        rgba(0,0,0,.20);

    color:#fff;

    font-size:15px;
}


input:focus{

    border-color:
        #45ff9a;

    box-shadow:
        0 0 20px
        rgba(69,255,154,.08);
}


/* =========================================
   BUTTONS
========================================= */

button{

    border:0;

    border-radius:13px;

    padding:
        13px 18px;

    font-weight:900;

    cursor:pointer;

    background:#45ff9a;

    color:#06110b;

    transition:.2s;
}


button:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(69,255,154,.20);
}


button.secondary{

    background:
        rgba(255,255,255,.08);

    color:#fff;
}


button.danger{

    background:#ff4f67;

    color:#fff;
}


.actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:20px;
}


/* =========================================
   MESSAGES
========================================= */

.error{

    color:#ff7385;

    margin-top:12px;

    display:none;
}


.success{

    color:#45ff9a;

    margin-top:12px;

    display:none;
}


/* =========================================
   TOOLBAR
========================================= */

.toolbar{

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    gap:15px;

    margin-bottom:15px;
}


/* =========================================
   DEMON ITEM
========================================= */

.item{

    display:grid;

    grid-template-columns:
        110px 1fr auto;

    gap:18px;

    align-items:center;

    padding:14px;

    border-radius:18px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    margin-top:12px;
}


.thumb{

    width:110px;

    height:70px;

    border-radius:12px;

    object-fit:cover;

    background:#111;
}


.item h3{

    margin-bottom:6px;
}


.meta{

    color:#9da8a2;

    font-size:13px;

    line-height:1.5;
}


.item-actions{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    justify-content:flex-end;
}


.hidden{

    display:none!important;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .grid{

        grid-template-columns:1fr;
    }


    .item{

        grid-template-columns:
            75px 1fr;
    }


    .thumb{

        width:75px;

        height:55px;
    }


    .item-actions{

        grid-column:
            1 / -1;

        justify-content:
            flex-start;
    }


    .wrap{

        width:94%;

        margin-top:30px;
    }

}

</style>

</head>


<body>


<div class="bg">

    <div class="orb o1"></div>

    <div class="orb o2"></div>

</div>


<header>

    <div class="logo">

        1x1x1x<span>GDPS</span>
        Admin

    </div>


    <div
        id="status"
        class="status"
    >

        Не авторизован

    </div>

</header>



<!-- =========================================
     LOGIN
========================================= -->

<div
    id="loginBox"
    class="panel login"
>

    <h2>
        🔐 Вход администратора
    </h2>


    <br>


    <div class="grid">

        <label>

            Email

            <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="admin@example.com"
            >

        </label>


        <label>

            Пароль

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
            >

        </label>

    </div>


    <div class="actions">

        <button id="loginBtn">

            Войти

        </button>

    </div>


    <div
        id="loginError"
        class="error"
    ></div>

</div>



<!-- =========================================
     ADMIN APP
========================================= -->

<main
    id="app"
    class="wrap hidden"
>

    <h1>
        Admin Panel
    </h1>


    <p class="sub">

        Управление Demon List
        через Firebase Realtime Database.

    </p>



    <!-- =====================================
         FORM
    ====================================== -->

    <section class="panel">

        <div class="toolbar">

            <h2 id="formTitle">

                ➕ Добавить демона

            </h2>

        </div>


        <div class="grid">


            <label>

                Название

                <input
                    id="name"
                    placeholder="KajankaDemon"
                >

            </label>


            <label>

                Song

                <input
                    id="song"
                    placeholder="Название песни"
                >

            </label>


            <label>

                By level

                <input
                    id="author"
                    placeholder="Автор уровня"
                >

            </label>


            <label>

                Screenshot URL

                <input
                    id="screenshot"
                    type="url"
                    placeholder="https://..."
                >

            </label>


            <label>

                Позиция

                <input
                    id="order"
                    type="number"
                    min="1"
                    placeholder="1"
                >

            </label>


        </div>


        <div class="actions">

            <button id="saveBtn">

                Добавить

            </button>


            <button
                id="cancelBtn"
                class="secondary hidden"
            >

                Отмена

            </button>


            <button
                id="logoutBtn"
                class="secondary"
            >

                Выйти

            </button>

        </div>


        <div
            id="message"
            class="success"
        ></div>


        <div
            id="formError"
            class="error"
        ></div>

    </section>



    <!-- =====================================
         DEMONS
    ====================================== -->

    <section class="panel">

        <div class="toolbar">

            <h2>
                📋 Демоны
            </h2>


            <button
                id="refreshBtn"
                class="secondary"
            >

                Обновить

            </button>

        </div>


        <div id="items"></div>

    </section>

</main>



<script type="module">


/* =========================================
   FIREBASE SDK
========================================= */

import {

    initializeApp

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,

    onAuthStateChanged,

    signInWithEmailAndPassword,

    signOut

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

    getDatabase,

    ref,

    onValue,

    push,

    set,

    update,

    remove

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



/* =========================================
   CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAIU8R7ApACuzEXjRZtgJoscJuWu1mf0DE",

    authDomain:
        "x1x1xgdps-demon-list.firebaseapp.com",

    databaseURL:
        "https://x1x1xgdps-demon-list-default-rtdb.firebaseio.com",

    projectId:
        "x1x1xgdps-demon-list",

    storageBucket:
        "x1x1xgdps-demon-list.firebasestorage.app",

    messagingSenderId:
        "335008832582",

    appId:
        "1:335008832582:web:695ee33fe001e19976fe47"

};



/* =========================================
   INIT
========================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getDatabase(app);


const demonsRef =
    ref(
        db,
        "demons"
    );



/* =========================================
   ELEMENTS
========================================= */

const $ =
    id =>
        document.getElementById(id);


let currentUser = null;

let editingId = null;

let cache = {};



/* =========================================
   ESCAPE
========================================= */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char])
        );
}



/* =========================================
   MESSAGE
========================================= */

function message(
    text,
    type="success"
){

    const success =
        $("message");

    const error =
        $("formError");


    success.style.display =
        "none";

    error.style.display =
        "none";


    if(type === "error"){

        error.textContent =
            text;

        error.style.display =
            "block";

    }else{

        success.textContent =
            text;

        success.style.display =
            "block";

    }

}



/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

    $("name").value="";
    $("song").value="";
    $("author").value="";
    $("screenshot").value="";
    $("order").value="";


    editingId =
        null;


    $("formTitle")
        .textContent =
        "➕ Добавить демона";


    $("saveBtn")
        .textContent =
        "Добавить";


    $("cancelBtn")
        .classList
        .add("hidden");


    $("message")
        .style.display =
        "none";


    $("formError")
        .style.display =
        "none";

}



/* =========================================
   LOGIN
========================================= */

$("loginBtn").onclick =
async () => {

    try{

        await signInWithEmailAndPassword(

            auth,

            $("email")
                .value
                .trim(),

            $("password")
                .value

        );


        $("loginError")
            .style.display =
            "none";


    }catch(error){

        $("loginError")
            .textContent =
            "Ошибка входа: "
            + error.message;


        $("loginError")
            .style.display =
            "block";

    }

};



/* =========================================
   LOGOUT
========================================= */

$("logoutBtn").onclick =
() => {

    signOut(auth);

};



/* =========================================
   CANCEL
========================================= */

$("cancelBtn").onclick =
clearForm;



/* =========================================
   REFRESH
========================================= */

$("refreshBtn").onclick =
() => {

    location.reload();

};



/* =========================================
   SAVE
========================================= */

$("saveBtn").onclick =
async () => {

    if(!currentUser){

        return;

    }


    const name =
        $("name")
            .value
            .trim();


    const song =
        $("song")
            .value
            .trim();


    const author =
        $("author")
            .value
            .trim();


    const screenshot =
        $("screenshot")
            .value
            .trim();


    const order =
        Number(
            $("order").value
        ) || 999999;



    if(
        !name ||
        !song ||
        !author ||
        !screenshot
    ){

        message(
            "Заполни название, Song, автора и Screenshot URL.",
            "error"
        );

        return;

    }



    const data = {

        name,
        song,
        author,
        screenshot,
        order

    };



    try{

        if(editingId){

            await update(

                ref(
                    db,
                    "demons/"
                    + editingId
                ),

                data

            );


            message(
                "Демон обновлён."
            );


        }else{

            const newRef =
                push(
                    demonsRef
                );


            await set(
                newRef,
                data
            );


            message(
                "Демон добавлен."
            );

        }


        clearForm();


    }catch(error){

        message(
            "Ошибка Firebase: "
            + error.message,
            "error"
        );

    }

};



/* =========================================
   RENDER ADMIN LIST
========================================= */

function render(data){

    cache =
        data || {};


    const demons =
        Object.entries(cache)

        .map(
            ([id,demon]) => ({
                id,
                ...demon
            })
        )

        .sort(
            (a,b) =>
                (Number(a.order) || 999999)
                -
                (Number(b.order) || 999999)
        );


    if(!demons.length){

        $("items").innerHTML = `

            <div class="sub">

                Пока нет демонов.

            </div>

        `;

        return;

    }



    $("items").innerHTML =

        demons.map(
            demon => `

            <div class="item">


                <img

                    class="thumb"

                    src="${esc(
                        demon.screenshot
                    )}"

                    alt=""

                >


                <div>

                    <h3>

                        ${esc(
                            demon.name
                        )}

                    </h3>


                    <div class="meta">

                        🎵
                        ${esc(
                            demon.song
                        )}

                        <br>

                        👤
                        ${esc(
                            demon.author
                        )}

                        · #

                        ${esc(
                            demon.order
                        )}

                    </div>

                </div>


                <div class="item-actions">


                    <button

                        onclick="
                            editDemon(
                                '${esc(demon.id)}'
                            )
                        "

                    >

                        Изменить

                    </button>


                    <button

                        class="danger"

                        onclick="
                            deleteDemon(
                                '${esc(demon.id)}'
                            )
                        "

                    >

                        Удалить

                    </button>


                </div>


            </div>

            `
        ).join("");

}



/* =========================================
   EDIT
========================================= */

window.editDemon =
id => {

    const demon =
        cache[id];


    if(!demon){

        return;

    }


    editingId =
        id;


    $("name").value =
        demon.name || "";


    $("song").value =
        demon.song || "";


    $("author").value =
        demon.author || "";


    $("screenshot").value =
        demon.screenshot || "";


    $("order").value =
        demon.order || "";



    $("formTitle")
        .textContent =
        "✏️ Редактировать демона";


    $("saveBtn")
        .textContent =
        "Сохранить";


    $("cancelBtn")
        .classList
        .remove("hidden");


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

};



/* =========================================
   DELETE
========================================= */

window.deleteDemon =
async id => {

    const demon =
        cache[id];


    if(!demon){

        return;

    }


    if(
        !confirm(
            `Удалить «${demon.name}»?`
        )
    ){

        return;

    }


    try{

        await remove(

            ref(
                db,
                "demons/"
                + id
            )

        );


        message(
            "Демон удалён."
        );


    }catch(error){

        message(
            "Ошибка удаления: "
            + error.message,
            "error"
        );

    }

};



/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(

    auth,

    user => {

        currentUser =
            user;


        if(user){

            $("loginBox")
                .classList
                .add("hidden");


            $("app")
                .classList
                .remove("hidden");


            $("status")
                .textContent =
                "● "
                + user.email;



            onValue(

                demonsRef,

                snapshot => {

                    render(
                        snapshot.val()
                    );

                },

                error => {

                    message(
                        "Ошибка чтения базы: "
                        + error.message,
                        "error"
                    );

                }

            );


        }else{

            $("loginBox")
                .classList
                .remove("hidden");


            $("app")
                .classList
                .add("hidden");


            $("status")
                .textContent =
                "Не авторизован";

        }

    }

);

</script>

</body>
</html>
