<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1x1x1xGDPS — Demon List</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#020706;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   LIVE BACKGROUND
========================= */

.live-bg{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(0,255,170,.08),
            transparent 40%
        ),
        #020706;
}

.live-bg::before{
    content:"";
    position:absolute;
    inset:-50%;
    background-image:
        linear-gradient(
            rgba(0,255,170,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,170,.055) 1px,
            transparent 1px
        );
    background-size:70px 70px;
    transform:
        perspective(500px)
        rotateX(62deg)
        translateY(180px)
        scale(1.5);
    animation:gridMove 14s linear infinite;
}

@keyframes gridMove{
    from{
        transform:
            perspective(500px)
            rotateX(62deg)
            translateY(180px)
            scale(1.5);
    }

    to{
        transform:
            perspective(500px)
            rotateX(62deg)
            translateY(250px)
            scale(1.5);
    }
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    pointer-events:none;
}

.orb1{
    width:420px;
    height:420px;
    background:#00ff9d;
    left:-140px;
    top:100px;
    animation:orbOne 12s ease-in-out infinite alternate;
}

.orb2{
    width:350px;
    height:350px;
    background:#00b879;
    right:-100px;
    top:300px;
    animation:orbTwo 15s ease-in-out infinite alternate;
}

.orb3{
    width:280px;
    height:280px;
    background:#00ffcc;
    left:40%;
    bottom:-150px;
    animation:orbThree 11s ease-in-out infinite alternate;
}

@keyframes orbOne{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(180px,100px);
    }
}

@keyframes orbTwo{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-140px,120px);
    }
}

@keyframes orbThree{
    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(100px,-100px);
    }
}

/* =========================
   PARTICLES
========================= */

.particle{
    position:fixed;
    width:2px;
    height:2px;
    background:#6dffd0;
    border-radius:50%;
    opacity:.5;
    pointer-events:none;
    z-index:-5;
    animation:particleFloat linear infinite;
}

@keyframes particleFloat{
    from{
        transform:translateY(110vh);
    }

    to{
        transform:translateY(-20vh);
    }
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:50;

    width:100%;

    background:rgba(2,10,8,.65);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(0,255,170,.12);
}

.header-inner{
    max-width:1200px;
    margin:auto;

    padding:18px 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo span{
    color:#4dffc0;
}

.header-label{
    font-size:11px;
    color:#7ca99a;
    letter-spacing:2px;
    font-weight:bold;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1200px;
    margin:auto;
    padding:70px 22px 100px;
}

/* =========================
   HERO
========================= */

.hero{
    text-align:center;
    margin-bottom:55px;
}

.badge{
    display:inline-flex;
    align-items:center;

    padding:8px 14px;

    border-radius:999px;

    border:1px solid rgba(0,255,170,.22);

    background:rgba(0,255,170,.06);

    color:#6dffd0;

    font-size:11px;
    font-weight:800;

    letter-spacing:1.5px;

    box-shadow:
        0 0 30px rgba(0,255,170,.08);
}

.hero h1{
    margin-top:22px;

    font-size:
        clamp(48px,8vw,88px);

    line-height:.95;

    letter-spacing:-4px;

    background:
        linear-gradient(
            120deg,
            #ffffff,
            #6dffd0
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    max-width:650px;

    margin:22px auto 0;

    color:#8fa9a1;

    line-height:1.7;

    font-size:15px;
}

/* =========================
   SEARCH
========================= */

.search-wrap{
    max-width:650px;
    margin:35px auto 0;
}

.search{
    width:100%;

    padding:17px 20px;

    border-radius:18px;

    border:1px solid rgba(0,255,170,.15);

    outline:none;

    background:rgba(255,255,255,.035);

    color:white;

    font-size:15px;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    transition:.25s;
}

.search::placeholder{
    color:#668078;
}

.search:focus{
    border-color:rgba(0,255,170,.45);

    box-shadow:
        0 0 35px rgba(0,255,170,.08);
}

/* =========================
   LIST
========================= */

.list{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:22px;
}

/* =========================
   CARD
========================= */

.card{
    position:relative;

    overflow:hidden;

    border-radius:25px;

    border:1px solid rgba(0,255,170,.12);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.card:hover{
    transform:translateY(-7px);

    border-color:rgba(0,255,170,.35);

    box-shadow:
        0 25px 80px rgba(0,255,170,.10);
}

.card::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-90px;
    top:-90px;

    border-radius:50%;

    background:#00ff9d;

    filter:blur(80px);

    opacity:.08;

    pointer-events:none;
}

/* =========================
   SCREENSHOT
========================= */

.screenshot{
    width:100%;

    aspect-ratio:16/9;

    object-fit:cover;

    display:block;

    background:#06100d;

    border-bottom:1px solid rgba(0,255,170,.10);
}

/* =========================
   CARD CONTENT
========================= */

.card-content{
    padding:20px;
}

.card-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-bottom:12px;
}

.rank{
    color:#54ffc4;

    font-size:13px;

    font-weight:900;

    letter-spacing:1px;
}

.demon-id{
    color:#6d8d84;

    font-size:11px;

    font-weight:bold;

    padding:6px 9px;

    border-radius:9px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.06);
}

.card h2{
    font-size:24px;

    margin-bottom:10px;

    letter-spacing:-.5px;
}

.meta{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:14px;
}

.tag{
    display:inline-flex;

    padding:7px 10px;

    border-radius:10px;

    background:rgba(0,255,170,.06);

    border:1px solid rgba(0,255,170,.10);

    color:#86b8aa;

    font-size:11px;

    font-weight:bold;
}

.song{
    color:#a9bdb7;

    font-size:13px;

    margin-bottom:15px;
}

.description{
    color:#829a92;

    font-size:13px;

    line-height:1.6;

    margin-bottom:16px;
}

/* =========================
   BUTTON
========================= */

.details{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:100%;

    padding:12px 15px;

    border-radius:14px;

    text-decoration:none;

    color:#07110e;

    background:#67ffd0;

    font-size:13px;

    font-weight:900;

    transition:.25s;
}

.details:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 30px rgba(0,255,170,.20);
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:#6e8780;
}

/* =========================
   FOOTER
========================= */

footer{
    max-width:1200px;

    margin:auto;

    padding:25px 22px 40px;

    text-align:center;

    color:#526b64;

    font-size:11px;

    letter-spacing:.5px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    main{
        padding-top:50px;
    }

    .list{
        grid-template-columns:1fr;
    }

    .header-label{
        display:none;
    }

    .hero h1{
        letter-spacing:-2px;
    }

}

@media(max-width:480px){

    main{
        padding-left:15px;
        padding-right:15px;
    }

    .header-inner{
        padding:15px;
    }

    .card-content{
        padding:17px;
    }

    .card h2{
        font-size:21px;
    }

}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition:none!important;
    }

}

</style>
</head>

<body>

<div class="live-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<header>

    <div class="header-inner">

        <div class="logo">
            <span>1x1x1x</span>GDPS
        </div>

        <div class="header-label">
            DEMON LIST
        </div>

    </div>

</header>

<main>

    <section class="hero">

        <div class="badge">
            1x1x1xGDPS • OFFICIAL LIST
        </div>

        <h1>Demon List</h1>

        <p>
            Официальный список демонов 1x1x1xGDPS.
            Здесь собраны уровни, их авторы, песни и другая информация.
        </p>

        <div class="search-wrap">

            <input
                id="search"
                class="search"
                type="text"
                placeholder="Поиск демона..."
                autocomplete="off"
            >

        </div>

    </section>

    <section
        id="list"
        class="list"
    ></section>

</main>

<footer>
    © 2026 1x1x1xGDPS • Demon List
</footer>

<script>

/* =========================
   FALLBACK
========================= */

const fallback = [

    {
        id:1,
        name:"KajankaDemon",
        song:"Kajanka naxyi",
        author:"1x1x1xGDPS",
        screenshot:"https://i.ibb.co/qKHtmQZ/Screenshot-2026-09-12-13-48-58-359-com-geode-launcher.jpg",
        description:"",
        order:1
    },

    {
        id:2,
        name:"1x1x1x Demon",
        song:"Theory of Everything 2",
        author:"MaFFaKa",
        screenshot:"https://i.ibb.co/nMt1vrxS/IMG-20260912-134157.jpg",
        description:"",
        order:2
    },

    {
        id:3,
        name:"ZQ",
        song:"TON 618SONGH",
        author:"1x1x1xGDPSOwner",
        screenshot:"https://i.ibb.co/tPFjdr0c/Screenshot-2026-09-12-13-45-02-264-com-geode-launcher.jpg",
        description:"",
        order:3
    },

    {
        id:4,
        name:"Y batarey",
        song:"Y battery",
        author:"1x1x1xGDPSOwner",
        screenshot:"https://i.ibb.co/CKkQrTQC/Screenshot-2026-09-12-13-53-01-755-com-geode-launcher.jpg",
        description:"",
        order:4
    },

    {
        id:5,
        name:"SlaQPlopHouse",
        song:"Slaughterhouse song (LOX)",
        author:"1x1x1xGDPSOwner",
        screenshot:"https://i.ibb.co/JWRh98Yq/Screenshot-2026-09-12-16-29-00-562-com-geode-launcher.jpg",
        description:"Демон находится в разработке.",
        order:5
    }

];

/* =========================
   STATE
========================= */

let demons = [];

let currentSearch = "";

/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =========================
   RENDER
========================= */

function render(){

    const list =
        document.getElementById("list");

    const query =
        currentSearch
        .trim()
        .toLowerCase();

    const filtered =
        demons.filter(demon => {

            const text =
                [
                    demon.name,
                    demon.song,
                    demon.author,
                    demon.description,
                    demon.id
                ]
                .join(" ")
                .toLowerCase();

            return text.includes(query);

        });

    if(filtered.length === 0){

        list.innerHTML = `
            <div class="empty">
                Ничего не найдено 😔
            </div>
        `;

        return;

    }

    list.innerHTML =
        filtered
        .map((demon,index) => {

            const description =
                demon.description
                ? `
                    <div class="description">
                        ${escapeHTML(demon.description)}
                    </div>
                  `
                : "";

            return `

                <article class="card">

                    <img
                        class="screenshot"
                        src="${escapeHTML(demon.screenshot || "")}"
                        alt="${escapeHTML(demon.name)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                        "
                    >

                    <div class="card-content">

                        <div class="card-top">

                            <div class="rank">
                                #${escapeHTML(
                                    demon.order ?? index + 1
                                )}
                            </div>

                            <div class="demon-id">
                                ID: ${escapeHTML(
                                    demon.id ?? "—"
                                )}
                            </div>

                        </div>

                        <h2>
                            ${escapeHTML(demon.name)}
                        </h2>

                        <div class="meta">

                            <div class="tag">
                                ${escapeHTML(demon.author)}
                            </div>

                        </div>

                        <div class="song">
                            🎵 ${escapeHTML(demon.song)}
                        </div>

                        ${description}

                        <a
                            class="details"
                            href="#"
                            onclick="return false;"
                        >
                            Подробнее →
                        </a>

                    </div>

                </article>

            `;

        })
        .join("");

}

/* =========================
   LOAD DATA.JSON
========================= */

async function loadDemons(){

    try{

        const response =
            await fetch(
                "data.json",
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "data.json должен содержать массив"
            );

        }

        demons =
            data
            .slice()
            .sort(
                (a,b) =>
                    (
                        Number(a.order)
                        || 999999
                    )
                    -
                    (
                        Number(b.order)
                        || 999999
                    )
            );

    }

    catch(error){

        console.error(
            "Ошибка data.json:",
            error
        );

        demons =
            fallback;

    }

    render();

}

/* =========================
   SEARCH
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        event => {

            currentSearch =
                event.target.value;

            render();

        }
    );

/* =========================
   PARTICLES
========================= */

function createParticles(){

    const amount =
        window.innerWidth < 600
        ? 25
        : 50;

    for(let i=0;i<amount;i++){

        const particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.animationDuration =
            (8 + Math.random() * 15) + "s";

        particle.style.animationDelay =
            (-Math.random() * 20) + "s";

        particle.style.opacity =
            .15 + Math.random() * .5;

        document.body.appendChild(
            particle
        );

    }

}

/* =========================
   MOUSE PARALLAX
========================= */

if(window.matchMedia(
    "(pointer:fine)"
).matches){

    document.addEventListener(
        "mousemove",
        event => {

            const x =
                (event.clientX /
                window.innerWidth - .5);

            const y =
                (event.clientY /
                window.innerHeight - .5);

            document.documentElement
                .style.setProperty(
                    "--mouse-x",
                    x
                );

            document.documentElement
                .style.setProperty(
                    "--mouse-y",
                    y
                );

        }
    );

}

/* =========================
   START
========================= */

createParticles();

loadDemons();

</script>

</body>
</html>
