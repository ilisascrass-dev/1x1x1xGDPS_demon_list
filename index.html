<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1x1x1xGDPS — Demon List</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#050806;
    overflow-x:hidden;
}

/* ===== LIVE BACKGROUND ===== */

.live-bg{
    position:fixed;
    inset:-20px;
    z-index:-1;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(30,100,65,.18),
            transparent 45%
        ),
        #050806;
    transition:transform .25s ease-out;
}

.orb{
    position:absolute;
    width:430px;
    height:430px;
    border-radius:50%;
    filter:blur(95px);
    opacity:.30;
}

.orb1{
    left:-140px;
    top:-150px;
    background:#20ff88;
    animation:float1 13s ease-in-out infinite alternate;
}

.orb2{
    right:-180px;
    top:25%;
    background:#00b7ff;
    animation:float2 17s ease-in-out infinite alternate;
}

.orb3{
    left:35%;
    bottom:-230px;
    background:#35ffb0;
    animation:float3 20s ease-in-out infinite alternate;
}

@keyframes float1{
    to{
        transform:translate(180px,160px) scale(1.25);
    }
}

@keyframes float2{
    to{
        transform:translate(-180px,120px) scale(1.3);
    }
}

@keyframes float3{
    to{
        transform:translate(120px,-150px) scale(1.2);
    }
}

.live-bg::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 15%,
            transparent 80%
        );
}

#particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    border-radius:50%;
    background:#45ff9a;

    box-shadow:
        0 0 10px
        rgba(69,255,154,.5);

    animation:
        particleFloat linear infinite;
}

@keyframes particleFloat{
    from{
        transform:translateY(110vh);
    }

    to{
        transform:
            translateY(-20vh)
            translateX(40px);
    }
}

/* ===== HEADER ===== */

header{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 7%;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(5,10,8,.58);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:#45ff9a;

    text-shadow:
        0 0 18px
        rgba(69,255,154,.4);
}

.badge{
    padding:8px 14px;

    border-radius:30px;

    color:#45ff9a;

    background:
        rgba(69,255,154,.08);

    border:
        1px solid
        rgba(69,255,154,.25);

    font-size:13px;
    font-weight:700;
}

/* ===== HERO ===== */

.hero{
    text-align:center;
    padding:85px 20px 45px;
}

.hero h1{
    font-size:clamp(45px,9vw,82px);

    font-weight:900;

    letter-spacing:-3px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #45ff9a,
            #baffdd
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.hero p{
    margin-top:17px;

    color:#9da8a2;

    font-size:17px;

    line-height:1.5;
}

/* ===== SEARCH ===== */

.search{
    width:min(700px,90%);
    margin:0 auto 45px;
}

.search input{
    width:100%;

    padding:18px 22px;

    border-radius:18px;

    border:
        1px solid
        rgba(255,255,255,.10);

    outline:none;

    color:white;

    background:
        rgba(255,255,255,.055);

    backdrop-filter:blur(20px);

    font-size:16px;

    transition:.25s;
}

.search input::placeholder{
    color:#7e8983;
}

.search input:focus{
    border-color:
        rgba(69,255,154,.55);

    box-shadow:
        0 0 30px
        rgba(69,255,154,.10);
}

/* ===== LIST ===== */

.list{
    width:min(1050px,92%);

    margin:auto;

    display:grid;

    gap:30px;

    padding-bottom:90px;
}

/* ===== CARD ===== */

.demon{
    position:relative;
    overflow:hidden;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    backdrop-filter:blur(22px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.20);

    transition:.35s;

    animation:
        appear .65s ease both;
}

.demon:hover{
    transform:translateY(-7px);

    border-color:
        rgba(69,255,154,.35);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35),

        0 0 35px
        rgba(69,255,154,.05);
}

/* ===== SCREENSHOT ===== */

.screenshot{
    width:100%;

    aspect-ratio:16/9;

    overflow:hidden;

    background:#030504;

    position:relative;
}

.screenshot::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            transparent 65%,
            rgba(0,0,0,.35)
        );
}

.screenshot img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:.6s;
}

.demon:hover .screenshot img{
    transform:scale(1.045);
}

/* ===== CONTENT ===== */

.content{
    position:relative;
    padding:25px;
}

.number{
    position:absolute;

    right:25px;
    top:19px;

    font-size:34px;
    font-weight:900;

    color:
        rgba(255,255,255,.075);
}

.demon h2{
    font-size:26px;
    margin-bottom:18px;
}

.info{
    display:grid;
    gap:10px;

    color:#aab4ae;

    line-height:1.4;
}

.info b{
    color:white;
}

.song{
    color:#45ff9a;

    text-shadow:
        0 0 12px
        rgba(69,255,154,.15);
}

/* ===== BUTTON ===== */

.btn{
    display:inline-block;

    margin-top:21px;

    padding:11px 18px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #45ff9a,
            #26e77f
        );

    color:#06110b;

    text-decoration:none;

    font-weight:900;

    transition:.2s;
}

.btn:hover{
    transform:
        translateY(-2px)
        scale(1.03);

    box-shadow:
        0 8px 25px
        rgba(69,255,154,.20);
}

/* ===== EMPTY ===== */

.empty{
    text-align:center;

    padding:60px 20px;

    color:#7d8982;

    font-size:17px;
}

/* ===== FOOTER ===== */

footer{
    text-align:center;

    padding:35px 20px;

    color:#68736d;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    background:
        rgba(0,0,0,.12);

    backdrop-filter:blur(15px);
}

footer strong{
    color:#45ff9a;
}

/* ===== ANIMATION ===== */

@keyframes appear{
    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* ===== MOBILE ===== */

@media(max-width:600px){

    header{
        padding:17px 20px;
    }

    .logo{
        font-size:20px;
    }

    .badge{
        font-size:11px;
        padding:7px 10px;
    }

    .hero{
        padding:65px 15px 35px;
    }

    .hero h1{
        letter-spacing:-2px;
    }

    .hero p{
        font-size:15px;
    }

    .list{
        width:94%;
        gap:22px;
    }

    .content{
        padding:21px;
    }

    .demon h2{
        font-size:23px;
    }

    .number{
        font-size:28px;
        right:20px;
    }

    .orb{
        width:300px;
        height:300px;
        filter:blur(75px);
    }
}
</style>
</head>

<body>

<div class="live-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div id="particles"></div>
</div>

<header>
    <div class="logo">
        1x1x1x<span>GDPS</span>
    </div>

    <div class="badge">
        DEMON LIST
    </div>
</header>

<section class="hero">
    <h1>Demon List</h1>

    <p>
        Все демоны 1x1x1xGDPS<br>
        в одном месте.
    </p>
</section>

<div class="search">
    <input
        id="search"
        type="text"
        autocomplete="off"
        placeholder="🔎 Поиск демона, песни или автора..."
    >
</div>

<main class="list" id="list">
    <div class="empty">
        Загрузка Demon List...
    </div>
</main>

<footer>
    <strong>1x1x1xGDPS</strong>
    • Demon List
</footer>

<script>
const DB_URL =
    "https://x1x1xgdps-demon-list-default-rtdb.firebaseio.com";

const list =
    document.getElementById("list");

const search =
    document.getElementById("search");


/* =========================================
   Старые демоны — показываются, если база
   пока пустая или недоступна
========================================= */

const fallback = [

    {
        name:"KajankaDemon",
        song:"Kajanka naxyi",
        author:"1x1x1xGDPS",

        screenshot:
        "https://i.ibb.co/qKHtmQZ/Screenshot-2026-09-12-13-48-58-359-com-geode-launcher.jpg",

        order:1
    },

    {
        name:"1x1x1x Demon",
        song:"Theory of Everything 2",
        author:"MaFFaKa",

        screenshot:
        "https://i.ibb.co/nMt1vrxS/IMG-20260912-134157.jpg",

        order:2
    },

    {
        name:"ZQ",
        song:"TON 618SONGH",
        author:"1x1x1xGDPSOwner",

        screenshot:
        "https://i.ibb.co/tPFjdr0c/Screenshot-2026-09-12-13-45-02-264-com-geode-launcher.jpg",

        order:3
    },

    {
        name:"Y batarey",
        song:"Y battery",
        author:"1x1x1xGDPSOwner",

        screenshot:
        "https://i.ibb.co/CKkQrTQC/Screenshot-2026-09-12-13-53-01-755-com-geode-launcher.jpg",

        order:4
    }

];


let demons = [];


/* Безопасный текст */

function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g, char => {

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });
}


/* =========================================
   Рендер
========================================= */

function render(){

    const query =
        search.value
            .toLowerCase()
            .trim();


    const filtered =
        demons.filter(demon => {

            const text =
                `${demon.name}
                 ${demon.song}
                 ${demon.author}`
                .toLowerCase();

            return text.includes(query);

        });


    if(!filtered.length){

        list.innerHTML = `
            <div class="empty">
                😔 Ничего не найдено.
            </div>
        `;

        return;
    }


    list.innerHTML =
        filtered.map((demon,index) => `

        <article class="demon">

            <div class="screenshot">

                <img
                    src="${esc(demon.screenshot)}"
                    alt="${esc(demon.name)}"
                    loading="lazy"
                >

            </div>


            <div class="content">

                <div class="number">
                    #${String(index + 1).padStart(2,"0")}
                </div>


                <h2>
                    ${esc(demon.name)}
                </h2>


                <div class="info">

                    <div>
                        🎵 Song:
                        <span class="song">
                            ${esc(demon.song)}
                        </span>
                    </div>


                    <div>
                        👤 By level:
                        <b>
                            ${esc(demon.author)}
                        </b>
                    </div>

                </div>


                <a
                    class="btn"
                    href="#"
                    onclick="return false"
                >
                    Подробнее
                </a>

            </div>

        </article>

        `).join("");
}


/* =========================================
   Firebase Realtime Database
========================================= */

async function loadDemons(){

    try{

        const response =
            await fetch(
                DB_URL + "/demons.json"
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(data){

            demons =
                Object.entries(data)
                .map(([id,demon]) => ({
                    id,
                    ...demon
                }))
                .sort(
                    (a,b) =>
                        (Number(a.order) || 999999)
                        -
                        (Number(b.order) || 999999)
                );

        }else{

            demons = fallback;

        }


        if(!demons.length){

            demons = fallback;

        }


    }catch(error){

        console.error(
            "Firebase error:",
            error
        );

        demons = fallback;

    }


    render();
}


search.addEventListener(
    "input",
    render
);


/* =========================================
   Частицы
========================================= */

const particles =
    document.getElementById(
        "particles"
    );


const count =
    window.innerWidth < 600
    ? 25
    : 45;


for(let i = 0; i < count; i++){

    const particle =
        document.createElement("div");


    particle.className =
        "particle";


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.animationDuration =
        (8 + Math.random() * 15) + "s";


    particle.style.animationDelay =
        (-Math.random() * 15) + "s";


    particle.style.opacity =
        .15 + Math.random() * .45;


    const size =
        1 + Math.random() * 3;


    particle.style.width =
        size + "px";


    particle.style.height =
        size + "px";


    particles.appendChild(
        particle
    );

}


/* =========================================
   Parallax
========================================= */

const background =
    document.querySelector(
        ".live-bg"
    );


document.addEventListener(
    "mousemove",
    event => {

        const x =
            (
                event.clientX /
                window.innerWidth -
                .5
            ) * 14;


        const y =
            (
                event.clientY /
                window.innerHeight -
                .5
            ) * 14;


        background.style.transform =
            `translate(${x}px,${y}px)`;

    }
);


/* =========================================
   Запуск
========================================= */

loadDemons();
</script>

</body>
</html>
