<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>1x1x1xGDPS — Demon List</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:#050806;

    color:#fff;

    min-height:100vh;

    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

.live-bg{

    position:fixed;

    inset:0;

    z-index:-5;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(69,255,154,.08),
            transparent 35%
        ),

        #050806;
}

.live-bg::before{

    content:"";

    position:absolute;

    inset:0;

    opacity:.13;

    background-image:

        linear-gradient(
            rgba(69,255,154,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(69,255,154,.12) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}


.orb{

    position:absolute;

    width:420px;

    height:420px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.16;

    pointer-events:none;

    animation:
        floatOrb 12s ease-in-out infinite;
}

.orb1{

    background:#00ff88;

    top:-150px;

    left:-120px;
}

.orb2{

    background:#00ffaa;

    right:-160px;

    top:25%;

    animation-delay:-4s;
}

.orb3{

    background:#00c878;

    bottom:-220px;

    left:30%;

    animation-delay:-8s;
}


@keyframes floatOrb{

    0%,100%{
        transform:translate3d(0,0,0);
    }

    50%{
        transform:translate3d(
            35px,
            -30px,
            0
        );
    }
}


/* =========================
   HEADER
========================= */

header{

    position:sticky;

    top:0;

    z-index:50;

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    background:
        rgba(5,8,6,.68);

    border-bottom:
        1px solid
        rgba(69,255,154,.12);
}

.header-inner{

    max-width:1200px;

    margin:auto;

    min-height:70px;

    padding:
        0 22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}


.logo{

    display:flex;

    align-items:center;

    gap:11px;

    font-weight:900;

    letter-spacing:.5px;

    white-space:nowrap;
}

.logo-dot{

    width:10px;

    height:10px;

    border-radius:50%;

    background:#45ff9a;

    box-shadow:
        0 0 10px #45ff9a,
        0 0 25px rgba(69,255,154,.7);

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.55;
        transform:scale(.75);
    }
}

.logo span{

    color:#45ff9a;
}

.header-label{

    color:#8c9a91;

    font-size:12px;

    font-weight:700;

    letter-spacing:2px;
}


/* =========================
   MAIN
========================= */

main{

    max-width:1200px;

    margin:auto;

    padding:
        65px 22px 80px;
}


/* =========================
   HERO
========================= */

.hero{

    text-align:center;

    margin-bottom:45px;

    transform-style:preserve-3d;
}

.badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        8px 13px;

    border-radius:999px;

    background:
        rgba(69,255,154,.07);

    border:
        1px solid
        rgba(69,255,154,.18);

    color:#75ffb0;

    font-size:12px;

    font-weight:800;

    letter-spacing:1px;

    margin-bottom:18px;

    box-shadow:
        0 0 30px
        rgba(69,255,154,.04);
}

.badge::before{

    content:"";

    width:6px;

    height:6px;

    border-radius:50%;

    background:#45ff9a;

    box-shadow:
        0 0 8px #45ff9a;
}

.hero h1{

    font-size:
        clamp(
            42px,
            8vw,
            82px
        );

    line-height:.95;

    font-weight:950;

    letter-spacing:-4px;

    margin-bottom:18px;

    background:
        linear-gradient(
            120deg,
            #ffffff 10%,
            #baffd7 45%,
            #45ff9a 90%
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 45px
        rgba(69,255,154,.08);
}

.hero p{

    max-width:620px;

    margin:auto;

    color:#87958c;

    font-size:16px;

    line-height:1.7;
}


/* =========================
   SEARCH
========================= */

.search-wrap{

    max-width:700px;

    margin:
        0 auto 48px;

    position:relative;
}

.search{

    width:100%;

    height:58px;

    border-radius:18px;

    outline:none;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color:#fff;

    padding:
        0 20px 0 52px;

    font-size:15px;

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    transition:.25s;

    box-shadow:
        inset 0 1px
        rgba(255,255,255,.03);
}

.search::placeholder{

    color:#68756d;
}

.search:focus{

    border-color:
        rgba(69,255,154,.35);

    background:
        rgba(69,255,154,.035);

    box-shadow:
        0 0 0 4px
        rgba(69,255,154,.045),
        0 0 35px
        rgba(69,255,154,.05);
}

.search-icon{

    position:absolute;

    left:19px;

    top:50%;

    transform:translateY(-50%);

    color:#45ff9a;

    font-size:20px;

    pointer-events:none;
}


/* =========================
   LIST
========================= */

.list{

    display:grid;

    gap:18px;
}


/* =========================
   CARD
========================= */

.demon{

    position:relative;

    display:grid;

    grid-template-columns:
        76px
        190px
        1fr
        auto;

    align-items:center;

    gap:22px;

    min-height:160px;

    padding:18px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.075);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.22);

    overflow:hidden;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.demon::before{

    content:"";

    position:absolute;

    left:0;

    top:0;

    width:3px;

    height:100%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #45ff9a,
            transparent
        );

    opacity:.35;
}

.demon::after{

    content:"";

    position:absolute;

    width:180px;

    height:180px;

    border-radius:50%;

    background:
        rgba(69,255,154,.045);

    filter:blur(45px);

    right:-80px;

    top:-100px;

    pointer-events:none;
}

.demon:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(69,255,154,.23);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.3),
        0 0 35px
        rgba(69,255,154,.045);
}


/* number */

.demon-number{

    width:64px;

    height:64px;

    border-radius:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

    font-weight:950;

    color:#45ff9a;

    background:
        rgba(69,255,154,.055);

    border:
        1px solid
        rgba(69,255,154,.13);

    box-shadow:
        inset 0 0 25px
        rgba(69,255,154,.025);
}


/* screenshot */

.demon-image{

    width:190px;

    height:120px;

    border-radius:17px;

    overflow:hidden;

    background:#080d09;

    border:
        1px solid
        rgba(255,255,255,.07);

    position:relative;
}

.demon-image::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            transparent 40%
        );

    pointer-events:none;
}

.demon-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .5s ease;
}

.demon:hover
.demon-image img{

    transform:scale(1.06);
}


/* info */

.demon-info{

    min-width:0;
}

.demon-info h2{

    font-size:23px;

    margin-bottom:9px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.meta{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:10px;
}

.tag{

    padding:
        5px 9px;

    border-radius:8px;

    font-size:11px;

    font-weight:750;

    color:#9ca9a1;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.055);
}

.song{

    color:#45ff9a;

    font-size:13px;

    font-weight:700;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* button */

.details{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    padding:
        11px 15px;

    border-radius:13px;

    color:#45ff9a;

    text-decoration:none;

    font-size:12px;

    font-weight:850;

    white-space:nowrap;

    background:
        rgba(69,255,154,.055);

    border:
        1px solid
        rgba(69,255,154,.13);

    transition:.25s;
}

.details:hover{

    background:
        rgba(69,255,154,.12);

    border-color:
        rgba(69,255,154,.3);

    box-shadow:
        0 0 25px
        rgba(69,255,154,.08);
}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    padding:70px 20px;

    color:#657269;
}

.empty strong{

    display:block;

    color:#aab7af;

    font-size:18px;

    margin-bottom:7px;
}


/* =========================
   FOOTER
========================= */

footer{

    max-width:1200px;

    margin:auto;

    padding:
        0 22px 35px;

    text-align:center;

    color:#4d5951;

    font-size:12px;
}

footer span{

    color:#45ff9a;
}


/* =========================
   PARTICLES
========================= */

.particle{

    position:fixed;

    width:2px;

    height:2px;

    border-radius:50%;

    background:#45ff9a;

    opacity:.35;

    pointer-events:none;

    z-index:-1;

    box-shadow:
        0 0 7px
        rgba(69,255,154,.7);

    animation:
        particleMove linear infinite;
}

@keyframes particleMove{

    from{
        transform:
            translateY(105vh);
    }

    to{
        transform:
            translateY(-10vh);
    }
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

    .demon{

        grid-template-columns:
            65px
            1fr
            auto;

        gap:15px;
    }

    .demon-image{

        width:150px;

        height:100px;

        grid-column:2;

        grid-row:1;
    }

    .demon-info{

        grid-column:2;

        grid-row:2;
    }

    .details{

        grid-column:3;

        grid-row:1 / span 2;
    }

    .demon-number{

        grid-column:1;

        grid-row:1 / span 2;
    }
}


@media(max-width:600px){

    main{

        padding:
            45px 14px 60px;
    }

    .header-inner{

        padding:
            0 15px;
    }

    .header-label{

        display:none;
    }

    .hero h1{

        letter-spacing:-2px;
    }

    .hero p{

        font-size:14px;
    }

    .search-wrap{

        margin-bottom:28px;
    }

    .demon{

        grid-template-columns:
            52px 1fr;

        padding:13px;

        border-radius:21px;

        gap:12px;
    }

    .demon-number{

        width:52px;

        height:52px;

        border-radius:15px;

        font-size:18px;

        grid-column:1;

        grid-row:1;
    }

    .demon-image{

        width:100%;

        height:145px;

        grid-column:2;

        grid-row:1;
    }

    .demon-info{

        grid-column:1 / -1;

        grid-row:2;
    }

    .demon-info h2{

        font-size:19px;
    }

    .details{

        grid-column:1 / -1;

        grid-row:3;

        width:100%;
    }
}


@media(max-width:390px){

    .demon-image{

        height:120px;
    }

    .hero h1{

        font-size:42px;
    }
}

</style>

</head>


<body>


<div class="live-bg">

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

</div>


<header>

    <div class="header-inner">

        <div class="logo">

            <div class="logo-dot"></div>

            <div>
                1x1x1x<span>GDPS</span>
            </div>

        </div>

        <div class="header-label">
            DEMON LIST
        </div>

    </div>

</header>


<main>


    <section class="hero">

        <div class="badge">
            1x1x1xGDPS • OFFICIAL LIST
        </div>

        <h1>
            Demon List
        </h1>

        <p>
            Уровни, прошедшие проверку сообщества
            1x1x1xGDPS. Ищи демонов, смотри скриншоты
            и следи за списком.
        </p>

    </section>


    <div class="search-wrap">

        <div class="search-icon">
            ⌕
        </div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Поиск уровня, песни или автора..."
            autocomplete="off"
        >

    </div>


    <section
        id="list"
        class="list"
    ></section>


</main>


<footer>

    <span>1x1x1xGDPS</span>
    • Demon List
    • Powered by data.json

</footer>


<script>

/* =====================================
   DATA
   ===================================== */

let demons = [];

const fallback = [

    {
        name:"KajankaDemon",

        song:"Kajanka naxyi",

        author:"1x1x1xGDPS",

        screenshot:
        "https://i.ibb.co/qKHtmQZ/Screenshot-2026-09-12-13-48-58-359-com-geode-launcher.jpg",

        order:1
    },

    {
        name:"1x1x1x Demon",

        song:"Theory of Everything 2",

        author:"MaFFaKa",

        screenshot:
        "https://i.ibb.co/nMt1vrxS/IMG-20260912-134157.jpg",

        order:2
    },

    {
        name:"ZQ",

        song:"TON 618SONGH",

        author:"1x1x1xGDPSOwner",

        screenshot:
        "https://i.ibb.co/tPFjdr0c/Screenshot-2026-09-12-13-45-02-264-com-geode-launcher.jpg",

        order:3
    },

    {
        name:"Y batarey",

        song:"Y battery",

        author:"1x1x1xGDPSOwner",

        screenshot:
        "https://i.ibb.co/CKkQrTQC/Screenshot-2026-09-12-13-53-01-755-com-geode-launcher.jpg",

        order:4
    }

];


/* =====================================
   LOAD DATA.JSON
   ===================================== */

async function loadDemons(){

    try{

        const response =
            await fetch(
                "data.json",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "data.json должен содержать массив"
            );

        }


        demons =
            data
            .slice()
            .sort(
                (a,b) =>
                    (Number(a.order) || 999999)
                    -
                    (Number(b.order) || 999999)
            );


    }catch(error){

        console.error(
            "Ошибка data.json:",
            error
        );

        demons = fallback;

    }


    render();

}


/* =====================================
   RENDER
   ===================================== */

function render(){

    const list =
        document.getElementById("list");

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        demons.filter(demon => {

            const text = [

                demon.name,

                demon.song,

                demon.author

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            return text.includes(query);

        });


    if(!filtered.length){

        list.innerHTML = `

            <div class="empty">

                <strong>
                    Ничего не найдено
                </strong>

                Попробуй изменить запрос.

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
        .map(
            (demon,index) => {

                const number =
                    Number(demon.order)
                    || index + 1;


                const screenshot =
                    demon.screenshot
                    || "";


                const name =
                    escapeHTML(
                        demon.name
                        || "Без названия"
                    );


                const song =
                    escapeHTML(
                        demon.song
                        || "Неизвестный трек"
                    );


                const author =
                    escapeHTML(
                        demon.author
                        || "Неизвестный автор"
                    );


                return `

                    <article
                        class="demon"
                    >

                        <div
                            class="demon-number"
                        >
                            #${number}
                        </div>


                        <div
                            class="demon-image"
                        >

                            ${
                                screenshot

                                ?

                                `
                                <img
                                    src="${escapeAttr(screenshot)}"
                                    alt="${escapeAttr(demon.name || "Demon")}"
                                    loading="lazy"
                                    onerror="this.style.display='none'"
                                >
                                `

                                :

                                ""
                            }

                        </div>


                        <div
                            class="demon-info"
                        >

                            <h2>
                                ${name}
                            </h2>


                            <div
                                class="meta"
                            >

                                <div
                                    class="tag"
                                >
                                    Автор:
                                    ${author}
                                </div>

                            </div>


                            <div
                                class="song"
                            >
                                ♪ ${song}
                            </div>

                        </div>


                        <a
                            class="details"
                            href="#"
                            onclick="return false"
                        >
                            Подробнее
                            →
                        </a>

                    </article>

                `;

            }
        )
        .join("");

}


/* =====================================
   HTML SECURITY
   ===================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttr(value){

    return escapeHTML(value);

}


/* =====================================
   SEARCH
   ===================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


/* =====================================
   PARTICLES
   ===================================== */

function createParticles(){

    const amount =
        window.innerWidth < 600
        ? 20
        : 35;


    for(
        let i = 0;
        i < amount;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.style.left =
            Math.random() * 100 + "%";


        particle.style.animationDuration =
            (8 + Math.random() * 15)
            + "s";


        particle.style.animationDelay =
            (-Math.random() * 15)
            + "s";


        particle.style.opacity =
            (.15 + Math.random() * .4);


        document.body.appendChild(
            particle
        );

    }

}

createParticles();


/* =====================================
   MOUSE PARALLAX
   ===================================== */

if(
    window.matchMedia(
        "(pointer:fine)"
    ).matches
){

    document.addEventListener(
        "mousemove",
        event => {

            const x =
                (event.clientX /
                window.innerWidth -
                .5);

            const y =
                (event.clientY /
                window.innerHeight -
                .5);


            document
                .querySelector(".orb1")
                .style.transform =
                    `
                    translate(
                        ${x * 25}px,
                        ${y * 25}px
                    )
                    `;


            document
                .querySelector(".orb2")
                .style.transform =
                    `
                    translate(
                        ${x * -35}px,
                        ${y * -35}px
                    )
                    `;


            document
                .querySelector(".orb3")
                .style.transform =
                    `
                    translate(
                        ${x * 20}px,
                        ${y * -20}px
                    )
                    `;

        }
    );

}


/* =====================================
   START
   ===================================== */

loadDemons();

</script>


</body>
</html>
